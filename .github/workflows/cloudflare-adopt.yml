name: cloudflare-adopt

# Deploys like cloudflare.yml, but accepts overriding the Worker's
# configuration when it was last changed in the Cloudflare dashboard (the
# Worker was made there, or someone edited it there). `cf deploy` asks before
# overriding such a configuration and, in CI, aborts instead of asking — so
# this runs it in a pseudo-terminal with CI=false and answers Yes, as you would
# at a terminal. The diff it overrides is in the log. After one run the Worker
# is cf's again and the normal deploy goes through. Run by hand: Actions →
# cloudflare-adopt → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task build:cf
        env:
          SITE_URL: https://idobata-bot.kuboon.workers.dev
      - name: Deploy, answering Yes to the override
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CI: "false"
          # A run by hand is one you are watching: log cf's API requests, so a
          # refusal names its endpoint (the token is sanitized out).
          DEBUG: "1"
        run: |
          # The answer waits in the terminal until cf asks; the fifo keeps the
          # terminal's input open until the deploy is done.
          mkfifo "$RUNNER_TEMP/answer"
          script -qefc "deno task cf deploy --prebuilt" /dev/null \
            < "$RUNNER_TEMP/answer" &
          deploy=$!
          exec 3> "$RUNNER_TEMP/answer"
          printf 'y\r' >&3
          wait "$deploy"
