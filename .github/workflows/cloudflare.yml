name: cloudflare

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Static site + Worker bundle, arranged as the Build Output Specification
      # for `cf deploy --prebuilt`. SITE_URL makes the social cards' og:image
      # absolute.
      - run: deno task build:cf
        env:
          SITE_URL: https://idobata-bot.kuboon.workers.dev
      # Every bindings.secret() must be set before a deploy goes through.
      # RP_SIGNING_KEY_JWK is generated here the first time (the Worker has
      # none yet) and kept on later deploys; see web/server/deploy_secrets.ts.
      # The file only ever holds secret values, so it is not printed.
      - name: Secrets for this deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if existing=$(deno task cf workers secrets list --worker idobata-bot 2>&1); then
            :
          elif grep -qiE "not found|10007" <<<"$existing"; then
            # The first deploy: the Worker does not exist yet.
            existing=""
          else
            echo "$existing"
            exit 1
          fi
          umask 077
          EXISTING_SECRETS="$existing" deno run -E web/server/deploy_secrets.ts \
            > "$RUNNER_TEMP/secrets.json"
      - run: deno task cf deploy --prebuilt --secrets-file "$RUNNER_TEMP/secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"
