name: cloudflare

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time, shared with cloudflare-adopt.yml.
concurrency:
  group: cloudflare-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Static site + Worker bundle, arranged as the Build Output Specification
      # for `cf deploy --prebuilt`. SITE_URL makes the social cards' og:image
      # absolute.
      - run: deno task build:cf
        env:
          SITE_URL: https://idobata-bot.kuboon.workers.dev
      - run: deno task cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
