name: preview

# A Worker Preview per pull request to main, deleted when the PR closes. It
# uses its own D1 (`idobata-bot-preview`, see cloudflare.config.ts), so a PR
# never touches the production data. The preview's URL is in the job summary.
#
# Sign-in does not work on a preview: its origin is not the RP_ORIGIN the IdP
# whitelists.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # Fork PRs get no secrets, so there is nothing to deploy with.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task build:cf --preview
      # Temporary, while the deploy gets a 403: what the token can reach. Only
      # the status codes and Cloudflare's error messages are printed.
      - name: Check the API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          account=ac92f36f0a2d84353b137574157f7480
          for path in user/tokens/verify \
            "accounts/$account/tokens/verify" \
            "accounts/$account" \
            "accounts/$account/workers/scripts" \
            "accounts/$account/workers/scripts/idobata-bot/settings" \
            "accounts/$account/workers/workers" \
            "accounts/$account/d1/database?name=idobata-bot-preview"; do
            body=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -w '\n%{http_code}' "https://api.cloudflare.com/client/v4/$path")
            code=$(tail -n1 <<<"$body")
            errors=$(head -n -1 <<<"$body" | jq -c '[.errors[]?.message]' 2>/dev/null)
            echo "$code $path $errors"
          done
      - name: Deploy the preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # As in cloudflare.yml: a 403 then names the refused endpoint.
          DEBUG: "1"
          WRANGLER_LOG: debug
        run: |
          set -o pipefail
          deno task cf previews deploy "pr-${{ github.event.pull_request.number }}" --prebuilt \
            2>&1 | tee "$RUNNER_TEMP/preview.log"
          {
            echo "### Preview for #${{ github.event.pull_request.number }}"
            grep -oE 'https://[^ ]+\.workers\.dev[^ ]*' "$RUNNER_TEMP/preview.log" | sort -u
          } >> "$GITHUB_STEP_SUMMARY"

  delete:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task cf previews delete "pr-${{ github.event.pull_request.number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
