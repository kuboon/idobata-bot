name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test
      - run: deno task build
      - run: deno task build:cf
      # Loads the bundled Worker without a DOM, as workerd does: a module that
      # touches a browser global at load fails here instead of at deploy.
      - run: deno eval 'await import("./web/worker-dist/worker.js")'
      - run: deno task cf deploy --prebuilt --dry-run
      # The browser smoke test's binary, taken from the GitHub release rather than with
      # `npm:@lightpanda/browser install`: that command checks the download against
      # get.lightpanda.io/versions.json, whose checksum fell out of step with the nightly it
      # points at. `@lightpanda/browser` runs whatever LIGHTPANDA_EXECUTABLE_PATH names.
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/lightpanda" \
            https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux
          chmod +x "$RUNNER_TEMP/lightpanda"
          echo "LIGHTPANDA_EXECUTABLE_PATH=$RUNNER_TEMP/lightpanda" >> "$GITHUB_ENV"
      - run: deno task test:browser
