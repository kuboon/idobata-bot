name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test
      - run: deno task build
      - run: deno task build:cf
      - run: deno task cf deploy --prebuilt --dry-run
      # @lightpanda/browser >= 1.6 no longer fetches its binary on install.
      - run: deno run -A npm:@lightpanda/browser install
      - run: deno task test:browser
